[versions]
agp = "9.5.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
junit = "4.13.2"
robolectric = "4.17"
roborazzi = "1.77.0"
coroutines = "1.10.2"
ksp = "2.3.12"
room = "2.8.5"
lifecycle = "2.10.0"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
okhttp = "5.5.1"
